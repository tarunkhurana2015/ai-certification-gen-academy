<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
<title id="title">Current implemented architecture</title><desc id="desc">A single executor uses the notebook host and shared tool runtime to drive the Movies app through Appium and XCUITest. The app uses TMDB. Saved evidence supports HTML, JSON, and video review.</desc>
<rect width="1600" height="1240" fill="white"/>
<text x="80" y="82" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#182B4D">Current implemented architecture</text>
<text x="80" y="128" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#53647D">Single executor • LLM chooses; host validates and executes; Appium drives</text>
<rect x="80" y="190" width="870" height="90" rx="18" fill="#F0F5FC" stroke="#C9D4E5" stroke-width="2"/>
<text x="515.0" y="246.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#182B4D">Human scenario</text>
